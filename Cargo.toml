[package]
name = "openshell-driver-apple-container"
description = "Apple Container compute driver for NVIDIA OpenShell (out-of-tree, UDS)"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/potable-anarchy/openshell-driver-apple-container"

[[bin]]
name = "openshell-driver-apple-container"
path = "src/main.rs"

[[bin]]
name = "trybox-entrypoint"
path = "src/entrypoint.rs"

[dependencies]
# Pinned by git rev: the public proto + identity surface this driver speaks
# against. Unmodified upstream openshell-core; we DO NOT fork it.
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", rev = "cf1bbb965d29ca9c5fb31c0d26624f7bd7ae1411", default-features = false, features = ["jwt"] }
openshell-isolation-interface = { git = "https://github.com/NVIDIA/OpenShell", rev = "cf1bbb965d29ca9c5fb31c0d26624f7bd7ae1411" }
openshell-sandbox-backend = { git = "https://github.com/NVIDIA/OpenShell", rev = "cf1bbb965d29ca9c5fb31c0d26624f7bd7ae1411" }

tokio = { version = "1", features = ["full"] }
tonic = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
futures = "0.3"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
anyhow = "1"
miette = { version = "7", features = ["fancy"] }
prost = "0.14"
prost-types = "0.14"
uuid = { version = "1", features = ["v4", "v7"] }
libc = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
